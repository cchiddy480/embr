name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/hub-app
      - run: npm run lint --workspace=packages/hub-app
      - run: npm run test --workspace=packages/hub-app
      # Now safe to run: the Phase B rewrite of validate-client-config.js
      # validates trip (`blocks`-shaped) configs against TripConfigSchema
      # and skips legacy template-based configs instead of failing on
      # fields they were never meant to have.
      - run: npm run client:validate
      # theming-audit.js exits 1 on existing rgba()/hex violations (there are
      # several in the legacy renderers right now). Non-blocking on purpose —
      # useful signal, not a hard gate yet — hence continue-on-error.
      - run: npm run audit:theme
        continue-on-error: true
